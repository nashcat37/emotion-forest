<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emotion Forest 情緒森林</title>
<link rel="stylesheet" href="css/style.css" />

<!-- 加到主畫面／全螢幕體驗相關設定 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#050810" />
<!-- iOS Safari 引擎不支援 web app manifest，需要另外用這組舊式 meta 標籤
     才能讓「加入主畫面」後以全螢幕模式啟動、隱藏Safari網址列 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="情緒森林" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
</head>
<body>

  <div id="stage">
    <div id="app">
      <!-- 所有 Scene 由 SceneManager 動態插入這裡 -->
    </div>
  </div>

  <!-- 請橫放手機提示：純CSS media query控制顯示/隱藏，偵測「觸控裝置且無hover能力
       (排除桌機用觸控螢幕但主要靠滑鼠的情況) + 目前是直向」，轉成橫向會自動消失，
       不需要JS判斷，也不依賴容易誤判的瀏覽器UA字串 -->
  <div id="rotatePrompt">
    <div id="rotatePromptIcon">📱</div>
    <div id="rotatePromptText">請將手機橫放<br>獲得最佳體驗</div>
  </div>

  <!-- 啟動門檻：僅為取得瀏覽器允許影片有聲播放所需的使用者手勢，非世界觀的一部分 -->
  <div class="start-gate" id="startGate">
    <div class="start-gate__hint" id="startGateHint"></div>
    <button class="start-gate__btn" id="startBtn">進入森林</button>
    <!-- 全螢幕切換按鈕：預設隱藏，只在JS偵測到「觸控裝置」且「瀏覽器支援
         Fullscreen API」時才顯示（iOS Safari引擎不支援此API，會自動隱藏，
         不會出現點了沒反應的按鈕）。只放在啟動門檻，進入森林後不再出現，
         避免干擾Ritual的沉浸感 -->
    <button class="start-gate__fullscreen-btn" id="fullscreenBtn" style="display:none;">⛶ 全螢幕</button>
    <!-- iOS加入主畫面提示：預設隱藏，只有main.js偵測到「iOS裝置」+
         「不是從主畫面圖示啟動」+「看起來是用Safari開的」才會顯示。
         iOS沒有API可以主動跳出加入主畫面的提示視窗，只能用文字引導 -->
    <div class="ios-install-hint" id="iosInstallHint" style="display:none;">
      <div class="ios-install-hint__text">在 iPhone / iPad 上遊玩，建議用 Safari 操作，同時點下方的「分享」鍵 <span class="ios-install-hint__icon">📤</span>，選擇「加入主畫面」，體驗會更完整、更沉浸。</div>
      <button class="ios-install-hint__dismiss" id="iosInstallHintDismiss">知道了</button>
    </div>
    <!-- 遊玩回饋入口之一：不分正式Ritual／瀏覽模式，只要玩家看得到
         start-gate（第一次開啟、或瀏覽模式離開後回到這裡）就能給意見。
         跟end-gate的同名按鈕共用同一個feedback-overlay面板，見main.js -->
    <button class="gate-feedback-btn" id="feedbackBtnStart">遊玩回饋</button>
  </div>

  <!-- 結尾畫面：Fog exit 播完後顯示，架構完全比照 start-gate。
       濃霧背景維持在畫面上不切走，這個畫面淡入蓋在最上層，
       讓玩家清楚知道今天的 Ritual 已經結束，不會停在一片濃霧不知所措 -->
  <div class="end-gate" id="endGate">
    <div class="end-gate__text">今晚的故事先說到這，<br>守夜燈會一直亮著、等你回來。</div>
    <div class="end-gate__actions">
      <button class="end-gate__btn" id="endBtn">離開森林</button>
      <!-- 遊玩回饋入口之二，跟start-gate的按鈕開啟同一個feedback-overlay -->
      <button class="gate-feedback-btn" id="feedbackBtnEnd">遊玩回饋</button>
    </div>
  </div>

  <!-- 遊玩回饋面板：獨立於start-gate／end-gate之外的共用元件，兩邊的
       「遊玩回饋」按鈕都是開啟同一份。內容透過main.js送往Google表單
       (formResponse)，同時備份一份到localStorage，避免玩家裝置離線
       或表單請求失敗時回饋內容憑空消失 -->
  <div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-overlay__dimmer"></div>
    <div class="feedback-overlay__panel">
      <div class="feedback-overlay__form" id="feedbackForm">
        <textarea class="feedback-overlay__input" id="feedbackInput" placeholder="想跟我們說的話，都可以寫在這裡..."></textarea>
        <div class="feedback-overlay__actions">
          <button class="feedback-overlay__submit" id="feedbackSubmitBtn">送出</button>
          <button class="feedback-overlay__cancel" id="feedbackCancelBtn">取消</button>
        </div>
      </div>
      <div class="feedback-overlay__ack" id="feedbackAck">收到了~謝謝你的回饋</div>
    </div>
  </div>

  <!-- 開發測試面板：預設用display:none藏起來，實際顯示與否由main.js
       的IS_DEV_BUILD開關決定，正式上線前把main.js那個常數改成false即可 -->
  <div class="dev-panel" id="devPanel" style="display:none;">
    <div>state: <span class="dev-panel__state" id="devState">-</span></div>
    <div id="devExtra"></div>
    <button id="devResetBtn">重置 isFirstEver</button>
    <div class="dev-panel__checkbox">
      跳到第 <input type="number" id="devJumpDayInput" min="1" max="999" style="width:40px" /> 天
      <button id="devJumpDayBtn">跳轉</button>
    </div>
    <label class="dev-panel__checkbox">
      <input type="checkbox" id="devBypassGate" /> 測試用：忽略時間限制
    </label>
    <button id="devSnowBtn">測試：下雪效果</button>
    <button id="devPetalBtn">測試：花瓣雨效果</button>
    <button id="devMemoryMatchBtn">測試：記憶翻牌小遊戲</button>
    <button id="devFogBtn">測試：18:00前濃霧</button>
  </div>

  <!-- 共用工具 -->
  <script src="js/utils/typewriter.js"></script>

  <!-- Manager 模組 -->
  <script src="js/managers/memoryManager.js"></script>
  <script src="js/managers/gardenManager.js"></script>
  <script src="js/managers/diaryManager.js"></script>
  <script src="js/managers/memoryMatchManager.js"></script>

  <!-- Scene 模組 -->
  <script src="js/scenes/fogScene.js"></script>
  <script src="js/scenes/mainHubScene.js"></script>
  <script src="js/scenes/seedPlantingScene.js"></script>

  <!-- Runtime Core -->
  <script src="js/sceneManager.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
